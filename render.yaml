# Render blueprint: managed Postgres + the API as a Docker web service.
# Dashboard -> New -> Blueprint -> pick this repo. Fill the `sync: false` values when asked.
databases:
  - name: brightwings-db
    plan: basic-256mb
    databaseName: brightwings
    user: brightwings

services:
  - type: web
    name: brightwings-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: brightwings-db, property: connectionString }
      - key: CORS_ALLOWED_ORIGIN
        value: https://portal.brightwingstravel.com
      - key: PORTAL_URL
        value: https://portal.brightwingstravel.com
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: PASSWORD_HASH_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_COOKIE_NAME
        value: refresh_token
      - key: REFRESH_TOKEN_EXP_DAYS
        value: "30"
      - key: JWT_TOKEN_EXP_MINUTES
        value: "15"
      - key: PHP_UPLOADER_BASE_URL
        value: https://resource.brightwingstravel.in
      - key: PHP_UPLOADER_TOKEN
        sync: false
      - key: SMS_WEBHOOK_URL
        sync: false
      - key: SMS_WEBHOOK_TOKEN
        sync: false
      - key: SUPPORT_PHONE
        sync: false
