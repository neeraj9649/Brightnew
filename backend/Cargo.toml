[package]
name = "bp"
version = "0.1.0"
edition = "2021"
[workspace]
members = [
  "src/base",
  "src/shared",
  "src/app",
  "src/modules/auth",
  "src/modules/bookings",
  "src/modules/rewards",
  "src/modules/referral",
  "src/modules/crm",
  "src/modules/analytics",
]

[workspace.dependencies]
actix-web = "4.11.0"
actix-multipart = "0.6"
actix-cors = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "macros", "migrate", "bigdecimal", "json"] }
bigdecimal = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
async-trait = "0.1.88"
futures-util = "0.3.26"
bytes = "1"
rand = "0.8"
sha2 = "0.10"
jsonwebtoken = "9.3.1"
hex = "0.4"
lazy_static = "1.5.0"
dotenv = "0.15"
env_logger = "0.11.0"
log = "0.4"
nu-ansi-term = "0.50.1"
anyhow = "1.0"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "multipart"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }

[dependencies]
base = { path = "src/base" }
shared = { path = "src/shared" }
app = { path = "src/app" }
actix-web = { workspace = true }

[[bin]]
name = "bp"
path = "src/main.rs"

[profile.dev]
incremental = true
