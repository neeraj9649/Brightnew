name: Build and Deploy Portal to Hostinger

on:
  push:
    branches: [main]
    paths:
      - BrightP
      - BrightP/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# Finish the current publication before starting another deployment.
concurrency:
  group: deploy-hostinger-frontends
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: portal
            domain: portal.brightwingstravel.com
            directory: BrightP
            output: BrightP/build

    steps:
      - name: Get latest code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: ${{ matrix.directory }}
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_RESOURCE_URL: ${{ secrets.REACT_APP_RESOURCE_URL || 'https://resource.brightwingstravel.in' }}
          REACT_APP_PORTAL_URL: ${{ secrets.REACT_APP_PORTAL_URL || 'https://portal.brightwingstravel.com' }}
        run: |
          set -euo pipefail
          test -n "$REACT_APP_API_URL" || { echo '::error::Set REACT_APP_API_URL'; exit 1; }
          npm run build

      - name: Prepare static output
        env:
          BUILD_OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          test -f "$BUILD_OUTPUT/index.html" || { echo "::error::Static entry point missing: $BUILD_OUTPUT/index.html"; exit 1; }
          cp -a "$BUILD_OUTPUT" dist
          # React Router needs Apache to serve index.html for client routes.
          if [ ! -f dist/.htaccess ]; then
            cat > dist/.htaccess <<'APACHE'
          DirectoryIndex index.html
          Options -MultiViews
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
          APACHE
          fi
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('dist').rglob('*'):
              if path.is_symlink():
                  raise SystemExit('::error::Build output contains a symlink')
              if any(part in ('.git', '.github', '.env') or part.startswith('.env.') for part in path.parts):
                  raise SystemExit('::error::Build output contains repository metadata or environment files')
              if path.suffix.lower() in ('.pem', '.key'):
                  raise SystemExit('::error::Build output contains a private-key file')
          PY

      - name: Save static build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ matrix.app }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy ${{ matrix.domain }}
    needs: build
    # Manual runs on other branches cannot publish to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: portal
            domain: portal.brightwingstravel.com
            path-secret: PORTAL_DEPLOY_PATH
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets[matrix.path-secret] }}
      DEPLOY_DOMAIN: ${{ matrix.domain }}
      STAGING_NAME: brightnew-${{ matrix.app }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Download static build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-${{ matrix.app }}
          path: dist

      - name: Validate static files and generate checksums
        run: |
          set -euo pipefail
          test -f dist/index.html
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('dist').rglob('*'):
              if path.is_symlink():
                  raise SystemExit('::error::Build output contains a symlink')
              if any(part in ('.git', '.github', '.env') or part.startswith('.env.') for part in path.parts):
                  raise SystemExit('::error::Build output contains repository metadata or environment files')
              if path.suffix.lower() in ('.pem', '.key'):
                  raise SystemExit('::error::Build output contains a private-key file')
          PY
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/SHA256SUMS"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set SSH_HOST}" "${SSH_USER:?Set SSH_USER}" "${SSH_PORT:?Set SSH_PORT}"
          SSH_PORT=$(printf '%s' "$SSH_PORT" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          if [[ ! "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo '::error::SSH_PORT must contain only the SSH port number from hPanel (no hostname, colon, or command).'
            exit 1
          fi
          SSH_PORT=$((10#$SSH_PORT))
          if (( SSH_PORT < 1 || SSH_PORT > 65535 )); then
            echo '::error::SSH_PORT must be between 1 and 65535. Use the SSH port shown in hPanel.'
            exit 1
          fi
          # Later SCP/SSH steps must use the same normalized port.
          printf 'SSH_PORT=%s\n' "$SSH_PORT" >> "$GITHUB_ENV"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${SSH_KEY_B64:-}" ]; then
            printf '%s' "$SSH_KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$SSH_KEY" | perl -pe 's/\\n/\n/g; s/\r$//' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -P "" -f ~/.ssh/deploy_key > /dev/null
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts || { echo '::error::No SSH host keys available'; exit 1; }
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f ~/.ssh/known_hosts > /dev/null || \
            { [ "$SSH_PORT" = 22 ] && ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null; }

      - name: Upload static files over SCP
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077; mkdir ~/$STAGING_NAME"
          # Copy the directory itself to include .htaccess and other dotfiles.
          scp -r "${SSH_OPTS[@]}" -P "$SSH_PORT" dist "$SSH_USER@$SSH_HOST:~/$STAGING_NAME/"
          scp "${SSH_OPTS[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/SHA256SUMS" "$SSH_USER@$SSH_HOST:~/$STAGING_NAME/SHA256SUMS"
          ssh "${SSH_OPTS[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd ~/$STAGING_NAME/dist && sha256sum --strict --quiet -c ../SHA256SUMS"

      - name: Publish into Hostinger document root
        run: |
          set -euo pipefail
          printf -v remote_command 'bash -s -- %q %q %q' "$DEPLOY_PATH" "$STAGING_NAME" "$DEPLOY_DOMAIN"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          umask 022
          [[ "$2" =~ ^brightnew-portal-[0-9]+-[0-9]+$ ]] || \
            { echo '::error::Invalid staging directory'; exit 1; }
          case "$3" in
            portal.brightwingstravel.com) ;;
            *) echo '::error::Unexpected deployment domain'; exit 1 ;;
          esac
          APP="${1:-$HOME/domains/$3/public_html}"
          STAGE="$HOME/$2/dist"
          # Resolve traversal and symlinks before checking the destination.
          [[ "$APP" = /* ]] || { echo '::error::Document root must be absolute'; exit 1; }
          APP=$(realpath -e -- "$APP")
          case "$APP" in
            "$HOME"/domains/*/public_html|"$HOME"/domains/*/public_html/*) ;;
            *) echo '::error::Document root must be under your Hostinger domains directory'; exit 1 ;;
          esac
          test -d "$APP" || { echo "::error::Document root does not exist: $APP"; exit 1; }
          test -f "$STAGE/index.html"
          cd "$STAGE"
          sha256sum --strict --quiet -c ../SHA256SUMS
          # No /dev/fd or process substitution: Hostinger may not provide them.
          find "$STAGE" -type f ! -path "$STAGE/index.html" -print0 > ../files
          printf '%s\0' "$STAGE/index.html" >> ../files
          BACKUP="$HOME/.brightnew-backups/$3/$2"
          (umask 077; mkdir -p "$BACKUP")
          # Validate every target and back up files before modifying the site.
          while IFS= read -r -d '' file; do
            relative="${file#"$STAGE/"}"
            target="$APP/$relative"
            cursor="$target"
            while [ "$cursor" != "$APP" ]; do
              [ ! -L "$cursor" ] || { echo '::error::Destination contains a symlink'; exit 1; }
              if [ "$cursor" != "$target" ] && [ -e "$cursor" ]; then
                test -d "$cursor" || { echo '::error::Destination parent is not a directory'; exit 1; }
              fi
              cursor=$(dirname "$cursor")
            done
            if [ -e "$target" ]; then
              test -f "$target" || { echo '::error::Destination is not a regular file'; exit 1; }
              mkdir -p "$BACKUP/$(dirname "$relative")"
              cp -p -- "$target" "$BACKUP/$relative"
            fi
          done < ../files
          # Keep old assets for open browser sessions. Each file is renamed
          # into place, with index.html last; this is not a whole-site swap.
          temporary=''
          trap '[ -z "$temporary" ] || rm -f -- "$temporary"' EXIT
          while IFS= read -r -d '' file; do
            relative="${file#"$STAGE/"}"
            target="$APP/$relative"
            mkdir -p "$(dirname "$target")"
            temporary=$(mktemp "$(dirname "$target")/.brightnew-XXXXXX")
            cp -- "$file" "$temporary"
            chmod 644 "$temporary"
            mv -f -- "$temporary" "$target"
            temporary=''
          done < ../files
          cd "$HOME"
          rm -rf -- "$HOME/$2"
          echo "Deployed to $APP; previous overwritten files saved in $BACKUP"
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
